name: Integration Tests

on:
  workflow_call:
    inputs:
      image_hash_tag:
        description: Full image URL with hash tag
        required: true
        type: string

      binary:
        description: Binary file name
        required: true
        type: string


permissions:
  contents: read
  packages: read


env:
  TEST_EXPORTER_PORT: 9793
  TEST_DBMS_DBNAME: xca_test
  TEST_DBMS_EXPORTER_USER: xca_test_exporter
  TEST_DBMS_EXPORTER_PASS: xca_test_exporter
  TEST_DBMS_ADMIN_USER: xca_test_admin
  TEST_DBMS_ADMIN_PASS: xca_test_admin


jobs:
  client-server-dbms:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - db: postgres
            image: docker.io/library/postgres:15.19-alpine3.24@sha256:6b2aacc6945a170594a05a332e2d9cfbef433d6be4bf5f246894f791b6e63c18
            conn_string: postgresql://{0}:{1}@dbms:5432/{2}?sslmode=disable
            options: >-
              --health-cmd "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
              --health-interval 5s
              --health-timeout 3s
              --health-retries 20

          - db: mysql
            image: docker.io/library/mysql:9.7.4-oraclelinux9@sha256:1954314de304d70fe85c67204d4676891ffa11dcd7caedaf5e9bc50b5f6be446
            conn_string: mysql://{0}:{1}@tcp(dbms:3306)/{2}?tls=false
            admin_username: root
            options: >-
              --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -p\"${MYSQL_ROOT_PASSWORD}\" --silent"
              --health-interval 5s
              --health-timeout 3s
              --health-retries 20

    container:
      image: &image_golang docker.io/library/golang:1.27.4-trixie@sha256:2cd7e1ebf475c6208122d2b9cefc638d98fcc8dfd8554c8872c9dd0c21f4ac61

    permissions:
      contents: read
      packages: read

    services:
      dbms:
        image: ${{ matrix.image }}
        env:
          POSTGRES_DB: ${{ env.TEST_DBMS_DBNAME }}
          POSTGRES_USER: ${{ env.TEST_DBMS_ADMIN_USER }}
          POSTGRES_PASSWORD: ${{ env.TEST_DBMS_ADMIN_PASS }}
          MYSQL_DATABASE: ${{ env.TEST_DBMS_DBNAME }}
          MYSQL_ROOT_PASSWORD: ${{ env.TEST_DBMS_ADMIN_PASS }}
        options: ${{ matrix.options }}

      exporter:
        image: ${{ inputs.image_hash_tag }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          XCA_EXPORTER_DATABASE_CONNECTION_STRING: &exporter_conn_string ${{ format(matrix.conn_string, env.TEST_DBMS_EXPORTER_USER, env.TEST_DBMS_EXPORTER_PASS, env.TEST_DBMS_DBNAME) }}
          XCA_EXPORTER_WEB_LISTEN_ADDRESS: :${{ env.TEST_EXPORTER_PORT }}
          XCA_EXPORTER_DATABASE_TEST_ON_START_ENABLED: "false"

    steps:
      - &step_checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false


      - name: Test
        shell: bash
        env:
          XCA_EXPORTER_DATABASE_CONNECTION_STRING: *exporter_conn_string
          XCA_EXPORTER_TEST_ADMIN_DATABASE_CONNECTION_STRING: ${{ format(matrix.conn_string, matrix.admin_username || env.TEST_DBMS_ADMIN_USER, env.TEST_DBMS_ADMIN_PASS, env.TEST_DBMS_DBNAME) }}
          ERR: 0
        run: |
          go run -tags=integration ./tests/integration \
            --test.metrics-url=http://exporter:${TEST_EXPORTER_PORT}/metrics || ERR=$?

          printf "=======================\nCurling exporter:\n"
          curl --verbose --connect-timeout 3 http://exporter:${TEST_EXPORTER_PORT}/metrics

          exit ${ERR}



  sqlite:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}

    container:
      image: *image_golang

    steps:
      - *step_checkout

      - name: Download binary artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: xca_exporter-dist
          path: dist


      - name: Test
        shell: bash
        env:
          BINARY: ${{ inputs.binary }}
          ERR: 0
        run: |
          set -euo pipefail

          DB_PATH="${RUNNER_TEMP}/xca-exporter.sqlite"
          LOG_PATH="${RUNNER_TEMP}/xca-exporter.log"

          export XCA_EXPORTER_DATABASE_CONNECTION_STRING="sqlite://${DB_PATH}"
          export XCA_EXPORTER_DATABASE_TEST_ON_START_ENABLED="false"
          export EXPORTER_WEB_LISTEN_ADDRESS=127.0.0.1:${TEST_EXPORTER_PORT}

          BINARY_PATH="${GITHUB_WORKSPACE}/dist/${BINARY}"

          chmod +x ${BINARY_PATH}

          ${BINARY_PATH} > "${LOG_PATH}" 2>&1 &
          EXPORTER_PID=${!}

          cleanup() {
            kill "${EXPORTER_PID}" 2>/dev/null || true
            wait "${EXPORTER_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          go run -tags=integration ./tests/integration \
            --database.connection-string="${XCA_EXPORTER_DATABASE_CONNECTION_STRING}" \
            --test.metrics-url="http://${EXPORTER_WEB_LISTEN_ADDRESS}/metrics" \
             || ERR=$?

          printf "=======================\nCurling exporter:\n"
          curl --verbose --connect-timeout 3 http://${EXPORTER_WEB_LISTEN_ADDRESS}/metrics

          [ ${ERR} -eq 0 ] || {
            printf "=======================\nExporter log:\n"
            cat ${LOG_PATH}
          }

          exit ${ERR}
